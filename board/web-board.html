<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인터넷 전광판</title>
<style>
/* the sign as a thing: a dark metal case with a bevel and four screws, the lamp board set into it */
html, body { height: 100%; margin: 0; background: #0b0c0e; overflow: hidden; }
body { display: flex; align-items: center; justify-content: center; }
#case { position: relative; box-sizing: border-box; border-radius: 6px;
  background: linear-gradient(180deg, #34373c 0%, #1d1f23 45%, #16181b 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -2px 3px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.6); }
#case::before { content: ""; position: absolute; inset: 0; border-radius: 6px; pointer-events: none;
  background:
    radial-gradient(circle at var(--s) var(--s), #6d7178 0 1.6px, #2a2c30 2.4px, transparent 3px),
    radial-gradient(circle at calc(100% - var(--s)) var(--s), #6d7178 0 1.6px, #2a2c30 2.4px, transparent 3px),
    radial-gradient(circle at var(--s) calc(100% - var(--s)), #6d7178 0 1.6px, #2a2c30 2.4px, transparent 3px),
    radial-gradient(circle at calc(100% - var(--s)) calc(100% - var(--s)), #6d7178 0 1.6px, #2a2c30 2.4px, transparent 3px); }
#well { background: #000; padding: 2px; border-radius: 2px;
  box-shadow: inset 0 2px 4px rgba(0,0,0,.9), 0 0 0 1px #070707, 0 1px 0 1px rgba(255,255,255,.06); }
canvas { display: block; }
</style>
</head>
<body>
<div id="case"><div id="well"><canvas id="led" aria-label="버스 실내 전광판" role="img"></canvas></div></div>
<script>
// The drawing runs in web-board-worker.js on its own thread (OffscreenCanvas), so the busy map page next to it cannot
// make the scrolling stall. Browsers without that run the same file here.
(function () {
  const W = 128, H = 32, V = '?v=3';
  const cv = document.getElementById('led'), box = document.getElementById('case');
  function measure() {
    const dpr = devicePixelRatio || 1;
    const pad = Math.max(5, Math.round(Math.min(innerWidth, innerHeight * 4) * 0.022));
    box.style.padding = pad + 'px';
    box.style.setProperty('--s', Math.max(3, pad / 2) + 'px');
    const aw = innerWidth - 2 * pad - 4, ah = innerHeight - 2 * pad - 4;
    const k = Math.max(2, Math.floor(Math.min(aw * dpr / W, ah * dpr / H)));
    cv.style.width = W * k / dpr + 'px'; cv.style.height = H * k / dpr + 'px';
    return { w: W * k, h: H * k };
  }
  let send;
  const size = measure();
  if (cv.transferControlToOffscreen && window.Worker) {
    const worker = new Worker('web-board-worker.js' + V);
    const off = cv.transferControlToOffscreen();
    worker.postMessage({ type: 'init', canvas: off, base: '', w: size.w, h: size.h }, [off]);
    send = m => worker.postMessage(m);
  } else {
    const tag = document.createElement('script');
    tag.src = 'web-board-worker.js' + V;
    tag.onload = () => window.webBoard.start(cv, '', size.w, size.h);
    document.head.appendChild(tag);
    send = m => { if (!window.webBoard) return; if (m.type === 'size') window.webBoard.fit(m.w, m.h); else if (m.type === 'style') window.webBoard.setStyle(m.code); };
  }
  addEventListener('resize', () => { const s = measure(); send({ type: 'size', w: s.w, h: s.h }); });
  // the style as on the real board: type 1111 to 4444 and Enter. It starts with the next stop
  let typed = '';
  addEventListener('keydown', e => {
    if (/^[0-9]$/.test(e.key)) { typed = (typed + e.key).slice(-4); return; }
    if (e.key !== 'Enter') return;
    send({ type: 'style', code: typed });
    typed = '';
  });
})();
</script>
</body>
</html>
