<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111820">
<title>안내방송 녹음자료</title>
<style>
:root{color-scheme:dark;--bg:#0c1117;--panel:#151d26;--line:#2a3745;--text:#eef4fa;--muted:#9eacba;--blue:#4ea8ff;--green:#45d68a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{width:min(1050px,100%);margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;gap:14px;margin-bottom:18px}.back{display:grid;place-items:center;width:46px;height:46px;border:1px solid var(--line);border-radius:14px;color:var(--text);text-decoration:none;font-size:25px;background:var(--panel)}h1{font-size:clamp(22px,5vw,32px);margin:0}.sub{color:var(--muted);font-size:14px;margin-top:4px}.tools{position:sticky;top:0;z-index:3;background:rgba(12,17,23,.94);backdrop-filter:blur(10px);padding:10px 0 14px}.search{width:100%;min-height:50px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);padding:0 16px;font-size:16px;outline:none}.search:focus{border-color:var(--blue)}.filters{display:flex;gap:8px;margin-top:10px;overflow:auto}.filter{min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text);font-weight:750;white-space:nowrap}.filter.active{border-color:var(--blue);background:#153452;color:#dcedff}.summary{color:var(--muted);font-size:14px;margin:15px 3px 10px}.list{display:grid;gap:9px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:9px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px}.name{min-width:0;font-weight:750;overflow-wrap:anywhere}.meta{display:flex;align-items:center;gap:8px;margin-top:5px;color:var(--muted);font-size:12px}.badge{padding:3px 7px;border-radius:999px;background:#263646}.badge.en{background:#3a294b;color:#e8ceff}.action{min-width:46px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:#202c38;color:var(--text);font-size:18px}.action.playing{border-color:var(--green);color:var(--green)}.download{color:var(--blue)}.empty{text-align:center;color:var(--muted);padding:50px 12px}dialog{border:1px solid var(--line);border-radius:18px;background:#17202a;color:var(--text);width:min(430px,calc(100% - 28px));padding:0;box-shadow:0 25px 80px #000b}dialog::backdrop{background:#000a}.modal{padding:22px}.modal h2{margin:0 0 8px}.modal p{color:var(--muted);margin:0 0 16px}.password{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;background:#0d141b;color:var(--text);padding:0 14px;font-size:18px}.error{color:#ff7785;min-height:24px;margin-top:7px}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.modal-actions button{height:44px;border-radius:11px;border:1px solid var(--line);padding:0 18px;background:#25313d;color:var(--text);font-weight:750}.modal-actions .ok{background:#1775c5;border-color:#278de4}@media(max-width:560px){.wrap{padding-left:11px;padding-right:11px}.item{grid-template-columns:minmax(0,1fr) 46px 46px;padding:11px}.sub{font-size:13px}}
</style></head><body><main class="wrap"><header><a class="back" href="./index.html" aria-label="지도로 돌아가기">‹</a><div><h1>안내방송 녹음자료</h1><div class="sub">한국어와 영어 녹음을 검색하고 같은 기준 음량으로 미리듣기</div></div></header><section class="tools"><input id="search" class="search" type="search" autocomplete="off" placeholder="정류소명 검색" aria-label="녹음 검색"><div class="filters"><button class="filter active" data-filter="all">전체</button><button class="filter" data-filter="ko">한국어</button><button class="filter" data-filter="en">영어</button></div></section><div id="summary" class="summary">목록 불러오는 중…</div><section id="list" class="list" aria-live="polite"></section></main>
<dialog id="passwordDialog"><form class="modal" method="dialog" id="passwordForm"><h2>다운로드 비밀번호</h2><p>녹음 파일을 다운로드하려면 비밀번호를 입력하세요.</p><input id="password" class="password" type="password" inputmode="numeric" autocomplete="current-password" aria-label="다운로드 비밀번호"><div id="passwordError" class="error"></div><div class="modal-actions"><button type="button" id="passwordCancel">취소</button><button class="ok" value="default">확인</button></div></form></dialog>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),listEl=$('#list'),summary=$('#summary'),search=$('#search');let files=[],filter='all',playing=null,pendingDownload=null;
const audioCtx=new (window.AudioContext||window.webkitAudioContext)(),decoded=new Map();let referencePromise;
const MOBILE_AUDIO=navigator.maxTouchPoints>0||matchMedia('(pointer:coarse)').matches||/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const previewAudio=new Audio();previewAudio.preload='auto';previewAudio.playsInline=true;previewAudio.setAttribute('playsinline','');previewAudio.setAttribute('webkit-playsinline','');
function info(file){const en=/ \(1\)\.(?:wav|mp3|m4a|ogg)$/i.test(file);return{file,en,label:file.replace(/ \(1\)(?=\.[^.]+$)/,'').replace(/\.[^.]+$/,'')}}
function stats(buffer){const block=Math.max(256,Math.floor(buffer.sampleRate*.05));let ge=0,gn=0,te=0,tn=0,peak=0;for(let start=0;start<buffer.length;start+=block){let e=0,n=0,end=Math.min(buffer.length,start+block);for(let c=0;c<buffer.numberOfChannels;c++){const d=buffer.getChannelData(c);for(let i=start;i<end;i++){const v=d[i];e+=v*v;peak=Math.max(peak,Math.abs(v));n++}}te+=e;tn+=n;if(n&&Math.sqrt(e/n)>=.005){ge+=e;gn+=n}}return{rms:Math.sqrt((gn?ge:te)/Math.max(1,gn||tn)),peak}}
async function decode(file){if(decoded.has(file))return decoded.get(file);const job=fetch('audio/'+encodeURIComponent(file),{cache:'force-cache'}).then(r=>{if(!r.ok)throw Error('load');return r.arrayBuffer()}).then(b=>audioCtx.decodeAudioData(b));decoded.set(file,job);return job}
function reference(){return referencePromise||(referencePromise=decode('이번정류소.wav').then(stats))}
function resetPlaying(){if(!playing)return;try{playing.source?.stop?.()}catch(e){}try{previewAudio.pause()}catch(e){}playing.button.classList.remove('playing');playing.button.textContent='▶';playing=null}
function playMobile(file,button){
  if(playing?.file===file){resetPlaying();return;}
  resetPlaying();button.textContent='…';
  previewAudio.src='audio/'+encodeURIComponent(file);previewAudio.currentTime=0;previewAudio.volume=1;
  playing={source:previewAudio,button,file};button.classList.add('playing');button.textContent='■';
  previewAudio.onended=()=>{if(playing?.source===previewAudio)resetPlaying()};
  previewAudio.onerror=()=>{if(playing?.source===previewAudio){resetPlaying();alert('이 녹음을 재생할 수 없습니다.')}};
  // This call stays directly inside the user's tap event. iOS/Samsung
  // browsers otherwise revoke playback permission while fetch/decode awaits.
  try{const result=previewAudio.play();if(result?.catch)result.catch(()=>{if(playing?.source===previewAudio){resetPlaying();alert('휴대폰의 미디어 음량을 확인한 뒤 다시 눌러 주세요.')}});}catch(e){resetPlaying();alert('이 녹음을 재생할 수 없습니다.');}
}
async function play(file,button){if(MOBILE_AUDIO){playMobile(file,button);return}if(playing){try{playing.source.stop()}catch(e){}playing.button.classList.remove('playing');playing.button.textContent='▶';if(playing.file===file){playing=null;return}playing=null}await audioCtx.resume();button.textContent='…';try{const [buffer,ref]=await Promise.all([decode(file),reference()]),srcStats=stats(buffer);let gain=Math.max(.25,Math.min(4,ref.rms/Math.max(.00001,srcStats.rms)));if(srcStats.peak)gain=Math.min(gain,.98/srcStats.peak);const source=audioCtx.createBufferSource(),node=audioCtx.createGain();node.gain.value=Math.max(.2,gain);source.buffer=buffer;source.connect(node).connect(audioCtx.destination);playing={source,button,file};button.classList.add('playing');button.textContent='■';source.onended=()=>{if(playing&&playing.source===source){button.classList.remove('playing');button.textContent='▶';playing=null}};source.start()}catch(e){button.textContent='▶';alert('이 녹음을 재생할 수 없습니다.')}
}
function render(){const q=search.value.trim().toLocaleLowerCase('ko');const shown=files.map(info).filter(x=>(filter==='all'||(filter==='en')===x.en)&&(!q||x.label.toLocaleLowerCase('ko').includes(q)));summary.textContent=`전체 ${files.length.toLocaleString()}개 중 ${shown.length.toLocaleString()}개`;listEl.replaceChildren(...shown.slice(0,500).map(x=>{const row=document.createElement('article');row.className='item';const text=document.createElement('div');text.innerHTML=`<div class="name"></div><div class="meta"><span class="badge ${x.en?'en':''}">${x.en?'영어':'한국어'}</span><span>${x.file.split('.').pop().toUpperCase()}</span></div>`;text.querySelector('.name').textContent=x.label;const pb=document.createElement('button');pb.className='action';pb.textContent='▶';pb.title='미리듣기';pb.onclick=()=>play(x.file,pb);const dl=document.createElement('button');dl.className='action download';dl.textContent='↓';dl.title='다운로드';dl.onclick=()=>requestDownload(x.file);row.append(text,pb,dl);return row}));if(!shown.length)listEl.innerHTML='<div class="empty">검색 결과가 없습니다.</div>';else if(shown.length>500)summary.textContent+=' · 검색 속도를 위해 처음 500개 표시'}
async function sha(text){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
function requestDownload(file){if(sessionStorage.getItem('audioDownloadUnlocked')==='1')return download(file);pendingDownload=file;$('#passwordError').textContent='';$('#password').value='';$('#passwordDialog').showModal();setTimeout(()=>$('#password').focus(),50)}
async function download(file){try{const r=await fetch('audio/'+encodeURIComponent(file));if(!r.ok)throw Error();const url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download=file;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}catch(e){alert('파일을 다운로드할 수 없습니다.')}}
$('#passwordCancel').onclick=()=>{$('#passwordDialog').close();pendingDownload=null};
$('#passwordForm').addEventListener('submit',async e=>{e.preventDefault();if(await sha($('#password').value)==='8797d0ddf0f02784b207fe18c89ac3bbc801b037c0d6f0e03a8051772d623c54'){sessionStorage.setItem('audioDownloadUnlocked','1');$('#passwordDialog').close();const file=pendingDownload;pendingDownload=null;if(file)download(file)}else{$('#passwordError').textContent='비밀번호가 맞지 않습니다.';$('#password').select()}});
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelector('.filter.active').classList.remove('active');b.classList.add('active');filter=b.dataset.filter;render()});search.addEventListener('input',render);
fetch('./audio-files.json',{cache:'no-cache'}).then(r=>r.json()).then(x=>{files=x;render()}).catch(()=>{summary.textContent='목록을 불러오지 못했습니다.'});
})();
</script></body></html>
