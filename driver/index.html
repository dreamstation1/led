<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1318">
<title>마을버스 운행 도우미</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#0f1318;--panel:#171c23;--line:#2a323d;--text:#eef2f6;--muted:#97a3b3;--green:#22c55e;--amber:#f5a524;--red:#ef4444;--blue:#3b82f6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}
body{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0 6px 0 0;white-space:nowrap}
header a{color:var(--muted);font-size:13px;text-decoration:none;margin-left:auto}
.seg{display:flex;gap:6px}
button{font:inherit;color:var(--text);background:#232a34;border:1px solid #3a4452;border-radius:10px;padding:8px 12px;cursor:pointer}
button.on{background:var(--blue);border-color:var(--blue)}
button.go{background:var(--green);border-color:var(--green);color:#06210f;font-weight:700}
button.stop{background:var(--red);border-color:var(--red);font-weight:700}
main{flex:1;display:flex;min-height:0}
#side{width:min(430px,46vw);display:flex;flex-direction:column;gap:10px;padding:10px;overflow:auto;border-right:1px solid var(--line)}
#map{flex:1;min-height:0}
@media (max-width:760px){main{flex-direction:column}#side{width:100%;border-right:0;border-bottom:1px solid var(--line);max-height:58vh}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card h2{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.big{font-size:26px;font-weight:800;line-height:1.2;word-break:keep-all}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.dist{font-size:20px;font-weight:700;color:#cfe0ff}
#alert{display:none;background:var(--red);color:#fff;font-size:22px;font-weight:800;text-align:center;padding:14px;border-radius:14px;animation:blink 1s steps(2) infinite}
#alert.show{display:block}
@keyframes blink{50%{opacity:.55}}
.sig{display:flex;align-items:center;gap:14px}
.lights{display:flex;gap:6px;background:#0a0d11;padding:8px 10px;border-radius:12px}
.lights i{width:22px;height:22px;border-radius:50%;background:#2b3138;display:block}
.lights i.r.on{background:var(--red);box-shadow:0 0 12px var(--red)}
.lights i.y.on{background:var(--amber);box-shadow:0 0 12px var(--amber)}
.lights i.g.on{background:var(--green);box-shadow:0 0 12px var(--green)}
.secs{font-size:30px;font-weight:800;min-width:64px}
.verdict{margin-top:8px;font-size:22px;font-weight:800;padding:8px 10px;border-radius:10px;text-align:center}
.verdict.ok{background:rgba(34,197,94,.16);color:var(--green)}
.verdict.warn{background:rgba(245,165,36,.16);color:var(--amber)}
.verdict.no{background:rgba(239,68,68,.16);color:var(--red)}
.verdict.na{background:#222831;color:var(--muted);font-size:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row label{color:var(--muted);font-size:13px}
input[type=number]{width:70px;font:inherit;background:#0f1318;color:var(--text);border:1px solid #3a4452;border-radius:8px;padding:6px}
#stops{list-style:none;margin:0;padding:0;font-size:14px}
#stops li{display:flex;justify-content:space-between;gap:8px;padding:6px 4px;border-bottom:1px solid #20262e}
#stops li.passed{color:#5d6876}
#stops li.next{color:#fff;font-weight:700;background:rgba(59,130,246,.15);border-radius:6px}
#stops li small{color:var(--muted);white-space:nowrap}
.note{color:var(--muted);font-size:12px;line-height:1.5}
.bus-dot{width:22px;height:22px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 6px rgba(59,130,246,.35)}
.sig-dot{width:12px;height:12px;border-radius:50%;background:#e5e7eb;border:2px solid #111}
.sig-dot.next{background:#fde047;width:16px;height:16px;box-shadow:0 0 10px #fde047}
</style>
</head>
<body>
<header>
  <h1>🚍 마을버스 운행 도우미</h1>
  <div class="seg" id="routeSeg"></div>
  <div class="seg">
    <button id="startGps" class="go">운행 시작 (GPS)</button>
    <button id="startSim">시뮬레이션</button>
    <button id="stopBtn" class="stop" hidden>종료</button>
  </div>
  <a href="../">← 버스 지도</a>
</header>
<main>
  <section id="side">
    <div id="alert"></div>
    <div class="card">
      <h2>다음 정류장</h2>
      <div class="big" id="nextStop">운행을 시작하세요</div>
      <div class="sub"><span class="dist" id="nextStopDist"></span> <span id="nextStopInfo"></span></div>
    </div>
    <div class="card">
      <h2>앞 신호</h2>
      <div class="sig">
        <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
        <div class="secs" id="sigSecs">–</div>
        <div><div class="big" style="font-size:20px" id="sigName">–</div><div class="sub" id="sigInfo"></div></div>
      </div>
      <div class="verdict na" id="verdict">신호 정보 대기</div>
    </div>
    <div class="card">
      <h2>설정</h2>
      <div class="row"><label>기본 정차 시간</label><input type="number" id="dwellDefault" min="5" max="120" value="20"><label>초 · 정류장별 실제 정차 시간은 운행할수록 자동으로 기록됩니다</label></div>
      <div class="row" style="margin-top:8px"><label>시뮬레이션 속도</label><span class="seg" id="simSpeedSeg"></span><button id="detourBtn" title="노선 이탈 경고 시험">이탈 테스트</button></div>
      <div class="row" style="margin-top:8px"><label><input type="checkbox" id="voiceOn" checked> 음성 안내 (이탈 · 다음 정류장)</label></div>
    </div>
    <div class="card">
      <h2>정류장 · 평균 정차 시간</h2>
      <ul id="stops"></ul>
    </div>
    <p class="note">신호는 서울시 실시간 신호(교통정보 T-data)를 쓰는 참고 정보이며, 조회 한도(하루 1,000회, 메인 지도와 공유) 때문에 신호마다 접근할 때 한두 번만 확인하고 그 뒤는 남은 시간으로 계산합니다. 통과 판단은 현재 속도·남은 거리·사이 정류장의 평균 정차 시간으로 계산한 추정이며, 실제 신호와 안전 운행이 항상 우선입니다.</p>
  </section>
  <div id="map"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
'use strict';
// ---------- helpers ----------
const $=id=>document.getElementById(id);
function hav(a,b,c,d){const R=6371000,p1=a*Math.PI/180,p2=c*Math.PI/180,dp=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180;const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function bearing(a,b,c,d){const p1=a*Math.PI/180,p2=c*Math.PI/180,dl=(d-b)*Math.PI/180;const y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return (Math.atan2(y,x)*180/Math.PI+360)%360;}
function fmtDist(m){return m<1000?Math.round(m)+'m':(m/1000).toFixed(1)+'km';}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

// ---------- state ----------
let DATA=null,route=null,cum=[],map,routeLine,busMarker,sigLayer,stopLayer;
let running=null; // 'gps' | 'sim'
let pos=null,along=0,lastAlong=null,speed=0,heading=null,offSince=null,offRoute=false,backSince=null,wrongWay=0;
let watchId=null,simTimer=null,simAlong=0,simDwellUntil=0,simSpeedMul=1,simDetour=0,wakeLock=null;
let nextStopIdx=-1,nextSigIdx=-1,dwellAt=null,announced=new Set(),lap=0;
const signalCache=new Map();let lastSignalCall=0;
const dwellDb=store.get('driverDwell',{});
$('dwellDefault').value=store.get('driverDwellDefault',20);
$('dwellDefault').onchange=e=>store.set('driverDwellDefault',Math.max(5,Math.min(120,Number(e.target.value)||20)));
$('voiceOn').checked=store.get('driverVoice',true);
$('voiceOn').onchange=e=>store.set('driverVoice',e.target.checked);
function say(text){if(!$('voiceOn').checked||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=1.05;speechSynthesis.speak(u);}catch(e){}}
function dwellFor(stop){const d=dwellDb[route.id+':'+stop.node];return d&&d.n>=1?d.avg:Number($('dwellDefault').value)||20;}

// ---------- map ----------
map=L.map('map',{zoomControl:true}).setView([37.55,126.85],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let follow=true;map.on('dragstart',()=>{follow=false;});

// ---------- route geometry ----------
function project(lat,lng,from,to){
  // nearest point on the polyline between shape indices [from,to)
  const pts=route.shape;let best={d:Infinity,along:0,i:0};
  const kx=Math.cos(lat*Math.PI/180)*111320,ky=110540;
  for(let i=Math.max(0,from);i<Math.min(pts.length-1,to);i++){
    const ax=(pts[i][1]-lng)*kx,ay=(pts[i][0]-lat)*ky,bx=(pts[i+1][1]-lng)*kx,by=(pts[i+1][0]-lat)*ky;
    const dx=bx-ax,dy=by-ay,len2=dx*dx+dy*dy;let t=len2?-(ax*dx+ay*dy)/len2:0;t=Math.max(0,Math.min(1,t));
    const px=ax+t*dx,py=ay+t*dy,d=Math.hypot(px,py);
    if(d<best.d)best={d,along:cum[i]+t*(cum[i+1]-cum[i]),i};
  }
  return best;
}
function indexAt(a){let lo=0,hi=cum.length-1;while(lo<hi){const m=(lo+hi)>>1;if(cum[m]<a)lo=m+1;else hi=m;}return lo;}
function pointAt(a){const i=Math.max(1,indexAt(a)),p=route.shape[i-1],q=route.shape[i],span=cum[i]-cum[i-1]||1,t=Math.max(0,Math.min(1,(a-cum[i-1])/span));return [p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t];}
function headingAt(a){const p=pointAt(Math.max(0,a-15)),q=pointAt(Math.min(route.length,a+15));return bearing(p[0],p[1],q[0],q[1]);}

function selectRoute(name){
  stopRun();
  route=DATA.routes.find(r=>r.name===name)||DATA.routes[0];
  store.set('driverRoute',route.name);history.replaceState(null,'','?route='+encodeURIComponent(route.name));
  cum=[0];for(let i=1;i<route.shape.length;i++)cum.push(cum[i-1]+hav(route.shape[i-1][0],route.shape[i-1][1],route.shape[i][0],route.shape[i][1]));
  route.length=cum[cum.length-1];
  document.querySelectorAll('#routeSeg button').forEach(b=>b.classList.toggle('on',b.textContent===route.name));
  [routeLine,stopLayer,sigLayer].forEach(l=>l&&map.removeLayer(l));
  routeLine=L.polyline(route.shape,{color:'#3b82f6',weight:6,opacity:.85}).addTo(map);
  stopLayer=L.layerGroup(route.stops.filter(s=>!s.virtual).map(s=>L.circleMarker([s.lat,s.lng],{radius:6,color:'#fff',weight:2,fillColor:'#3b82f6',fillOpacity:1}).bindTooltip(s.name))).addTo(map);
  sigLayer=L.layerGroup().addTo(map);
  route.signals.forEach(s=>{s._m=L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:'<div class="sig-dot"></div>',iconSize:[14,14]})}).bindTooltip('🚦 '+s.name).addTo(sigLayer);});
  map.fitBounds(routeLine.getBounds(),{padding:[30,30]});
  along=0;nextStopIdx=-1;nextSigIdx=-1;announced.clear();renderStops();renderIdle();
}
function renderIdle(){$('nextStop').textContent='운행을 시작하세요';$('nextStopDist').textContent='';$('nextStopInfo').textContent=route.name+' · 정류장 '+route.stops.filter(s=>!s.virtual).length+'개 · 신호 '+route.signals.length+'개 · '+fmtDist(route.length);showSignal(null);}
function renderStops(){
  $('stops').innerHTML=route.stops.filter(s=>!s.virtual).map(s=>{
    const d=dwellDb[route.id+':'+s.node],i=route.stops.indexOf(s);
    return `<li data-i="${i}" class="${running&&s.along<along-25?'passed':''}${i===nextStopIdx?' next':''}"><span>${esc(s.name)}</span><small>${d?`평균 ${Math.round(d.avg)}초 (${d.n}회)`:'기록 없음'}</small></li>`;
  }).join('');
}

// ---------- position updates ----------
function onPosition(lat,lng,acc,gpsSpeed,now){
  pos={lat,lng};
  // search near the previous position first (loop routes reuse roads), then everywhere
  let p=lastAlong==null?project(lat,lng,0,route.shape.length):project(lat,lng,indexAt(lastAlong-300)-1,indexAt(lastAlong+600)+1);
  if(p.d>60){const g=project(lat,lng,0,route.shape.length);if(g.d<p.d-20)p=g;}
  const limit=Math.max(50,(acc||0)*1.5);
  // off-route: away from the line for 8 s
  if(p.d>limit){offSince=offSince||now;backSince=null;if(!offRoute&&now-offSince>8000){offRoute=true;alertOn('⚠ 노선 이탈 · 경로에서 '+fmtDist(p.d)+' 벗어남');say('노선을 이탈했습니다. 경로로 돌아가 주세요.');if(navigator.vibrate)navigator.vibrate([400,150,400]);}}
  else{offSince=null;if(offRoute){backSince=backSince||now;if(now-backSince>3000){offRoute=false;alertOff();say('노선으로 돌아왔습니다.');}}}
  if(offRoute)$('alert').textContent='⚠ 노선 이탈 · 경로에서 '+fmtDist(p.d)+' 벗어남';
  if(!offRoute){
    const prev=along;along=p.along;
    if(lastAlong!=null){const dA=along-lastAlong;wrongWay=dA<-3?wrongWay+(-dA):Math.max(0,wrongWay-Math.max(0,dA));
      if(wrongWay>60&&!$('alert').classList.contains('show')){alertOn('⚠ 노선 반대 방향으로 가는 중');say('노선 반대 방향입니다.');}
      if(wrongWay<10&&$('alert').textContent.includes('반대'))alertOff();}
    lastAlong=along;
    const dt=(now-(onPosition.t||now))/1000;onPosition.t=now;
    const meas=gpsSpeed!=null&&gpsSpeed>=0?gpsSpeed:(dt>0?Math.max(0,(along-prev)/dt):speed);
    speed=speed*0.6+meas*0.4;
  }
  if(!busMarker)busMarker=L.marker([lat,lng],{icon:L.divIcon({className:'',html:'<div class="bus-dot"></div>',iconSize:[22,22]}),zIndexOffset:1000}).addTo(map);
  else busMarker.setLatLng([lat,lng]);
  if(follow)map.panTo([lat,lng],{animate:true,duration:.5});
  trackDwell(now);update(now);
}
function alertOn(t){$('alert').textContent=t;$('alert').classList.add('show');}
function alertOff(){$('alert').classList.remove('show');}

// actual dwell time per stop: time spent nearly stopped within 30 m of it
function trackDwell(now){
  const s=route.stops.find(x=>!x.virtual&&Math.abs(x.along-along)<30);
  if(s&&speed<1.5){if(!dwellAt||dwellAt.s!==s)dwellAt={s,start:now,last:now};else dwellAt.last=now;return;}
  if(dwellAt&&(speed>3||!s||s!==dwellAt.s)){
    const sec=(dwellAt.last-dwellAt.start)/1000;
    if(sec>=3&&sec<=180&&running==='gps'){const k=route.id+':'+dwellAt.s.node,d=dwellDb[k]||{n:0,avg:0};d.avg=(d.avg*d.n+sec)/(d.n+1);d.n=Math.min(d.n+1,50);dwellDb[k]=d;store.set('driverDwell',dwellDb);renderStops();}
    dwellAt=null;
  }
}

// ---------- next stop / next signal ----------
function update(now){
  const ns=route.stops.findIndex(s=>!s.virtual&&s.along>along+8);
  if(ns!==nextStopIdx){nextStopIdx=ns;renderStops();const li=document.querySelector('#stops li.next');li&&li.scrollIntoView({block:'nearest'});}
  const stop=route.stops[ns];
  if(stop){
    const d=stop.along-along;$('nextStop').textContent=stop.name;$('nextStopDist').textContent=fmtDist(d);
    $('nextStopInfo').textContent='· 평균 정차 '+Math.round(dwellFor(stop))+'초 · '+Math.round(speed*3.6)+'km/h';
    if(d<250&&!announced.has(ns)){announced.add(ns);say('다음 정류장은 '+stop.name+'입니다.');}
  }else{$('nextStop').textContent='종점';$('nextStopDist').textContent='';$('nextStopInfo').textContent='';}
  const si=route.signals.findIndex(s=>s.along>along+5);
  if(si!==nextSigIdx){route.signals.forEach((s,i)=>s._m.setIcon(L.divIcon({className:'',html:`<div class="sig-dot${i===si?' next':''}"></div>`,iconSize:i===si?[18,18]:[14,14]})));nextSigIdx=si;}
  const sig=route.signals[si];
  if(!sig){showSignal(null);return;}
  const dist=sig.along-along;
  if(dist<=300)fetchSignal(sig,dist).catch(()=>{});
  showSignal(sig,dist,now);
}

// ---------- live signal (Seoul T-data, same API and key as the main map) ----------
const SEOUL_TDATA_KEY='ed4ccf31-b58b-47ff-9e65-c1374bafb93b';
const SEOUL_TDATA_URL='https://t-data.seoul.go.kr/apig/apiman-gateway/tapi/v2xSignalPhaseTimingFusionCurrentInfo/1.0';
const DIRS=[{key:'nt',deg:0,label:'북쪽'},{key:'ne',deg:45,label:'북동쪽'},{key:'et',deg:90,label:'동쪽'},{key:'se',deg:135,label:'남동쪽'},{key:'st',deg:180,label:'남쪽'},{key:'sw',deg:225,label:'남서쪽'},{key:'wt',deg:270,label:'서쪽'},{key:'nw',deg:315,label:'북서쪽'}];
const gap=(a,b)=>Math.abs(((a-b+540)%360)-180);
function statusColor(n){n=String(n||'').toLowerCase();if(n==='stop-and-remain')return 'red';if(n.includes('movement-allowed'))return 'green';if(n.includes('clearance'))return 'yellow';return null;}
function recTime(r){const u=Number(r?.trsmUtcTime);if(Number.isFinite(u)&&u>1e12)return u;const t=String(r?.regDt||'');return /^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(t)?Date.parse(t.replace(' ','T')+'+09:00'):Date.parse(t);}
// The Seoul key allows 1,000 calls a day, shared with the main map, so each
// signal is read once on approach (within 300 m) and at most once more when the
// phase we know has ended while the bus is still well short of it.
let signalBackoffUntil=0;
async function fetchSignal(sig,dist){
  const c=signalCache.get(sig.id),now=Date.now();
  if(now<signalBackoffUntil||c?.loading)return;
  if(c){
    const expired=!c.phase||c.phase.expiresAt==null||c.phase.expiresAt<=now;
    if(c.lap===lap&&(c.calls>=2||!expired||dist<120||now-c.at<20000))return;
  }
  if(now-lastSignalCall<4000)return;
  lastSignalCall=now;
  const calls=c&&c.lap===lap?c.calls+1:1;
  signalCache.set(sig.id,{...(c||{}),loading:true,at:c?.at||0,calls,lap});
  try{
    const u=new URL(SEOUL_TDATA_URL);u.search=new URLSearchParams({apikey:SEOUL_TDATA_KEY,type:'json',numOfRows:'100',pageNo:'1',itstId:sig.id}).toString();
    const res=await fetch(u,{cache:'no-store'});
    if(res.status===429){signalBackoffUntil=Date.now()+30*60*1000;throw new Error('오늘 신호 조회 한도(하루 1,000회)를 다 썼습니다');}
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json(),root=data?.response||data,items=root?.body?.items?.item??root?.items?.item??root?.item??(Array.isArray(root)?root:[]);
    const rows=(Array.isArray(items)?items:[items]).filter(r=>r&&String(r.itstId)===String(sig.id)).sort((a,b)=>recTime(b)-recTime(a));
    const newest=recTime(rows[0]),rec=rows.filter(r=>newest-recTime(r)<=5000).reverse().reduce((o,r)=>{for(const[k,v]of Object.entries(r))if(v!==''&&v!=null)o[k]=v;return o;},{});
    signalCache.set(sig.id,{at:Date.now(),phase:pickPhase(rec,sig),calls,lap});
  }catch(e){
    // a blocked 429 reaches the page as a failed fetch without a status
    const msg=e instanceof TypeError?'신호 서버 응답 없음 (조회 한도 초과일 수 있음)':e.message||'신호 오류';
    if(e instanceof TypeError)signalBackoffUntil=Date.now()+5*60*1000;
    signalCache.set(sig.id,{at:Date.now(),error:msg,calls,lap});
  }
}
function movement(rec,dir,type,now){
  const stem=dir.key+type+'sg',st=rec?.[stem+'StatNm'];if(st==null||st==='')return null;
  const raw=rec[stem+'RmdrCs'],dur=raw==null||raw===''?null:Number(raw)/10,ts=recTime(rec);
  return {color:statusColor(st),expiresAt:Number.isFinite(dur)&&dur>=0&&dur<3600?ts+dur*1000:null};
}
function pickPhase(rec,sig){
  if(!rec||!Object.keys(rec).length)return null;
  const now=Date.now(),ts=recTime(rec);if(!Number.isFinite(ts)||now-ts>20000)return null;
  const from=(sig.heading+180)%360,dir=DIRS.reduce((a,b)=>gap(a.deg,from)<=gap(b.deg,from)?a:b);
  let straight=movement(rec,dir,'St',now)||movement(rec,dir,'Bs',now);const left=movement(rec,dir,'Lt',now);
  const turningLeft=sig.turn<-32&&sig.turn>-155,g=turningLeft&&left?left:straight||left;
  if(!g)return null;
  return {color:g.color,expiresAt:g.expiresAt,label:dir.label+' 진입 · '+(turningLeft&&left?'좌회전':'직진')};
}
function showSignal(sig,dist,now=Date.now()){
  const lights=document.querySelectorAll('.lights i');lights.forEach(i=>i.classList.remove('on'));
  const v=$('verdict');
  if(!sig){$('sigName').textContent='–';$('sigInfo').textContent='';$('sigSecs').textContent='–';v.className='verdict na';v.textContent=running?'앞쪽에 신호 없음':'신호 정보 대기';return;}
  $('sigName').textContent=sig.name;
  const c=signalCache.get(sig.id),ph=c?.phase;
  // stops between here and the signal add their usual dwell time
  const between=route.stops.filter(s=>!s.virtual&&s.along>along+8&&s.along<sig.along-5);
  const dwell=between.reduce((t,s)=>t+dwellFor(s)+6,0);
  const v_eff=Math.max(speed,speed<1?6:4),travel=dist/v_eff,eta=travel+dwell;
  $('sigInfo').textContent=fmtDist(dist)+' 앞'+(between.length?` · 사이 정류장 ${between.length}곳(정차 약 ${Math.round(dwell)}초)`:'')+(ph?.label?' · '+ph.label:'');
  if(dist>300){$('sigSecs').textContent='–';v.className='verdict na';v.textContent='300m 안에 들어오면 신호를 확인합니다';return;}
  if(ph&&ph.expiresAt!=null&&ph.expiresAt<=now&&(ph.color==='red'||ph.color==='green')){
    // known phase already over: red turned green, green turned (yellow then) red
    const was=ph.color;$('sigSecs').textContent='–';
    document.querySelector('.lights .'+(was==='red'?'g':'r')).classList.add('on');
    v.className='verdict '+(was==='red'?'ok':'no');v.textContent=was==='red'?'녹색으로 바뀜 (추정) · 통과 가능성 높음':'적색으로 바뀜 (추정) · 정지 예상';return;
  }
  if(!ph||ph.expiresAt==null||ph.expiresAt<=now){
    $('sigSecs').textContent='–';v.className='verdict na';
    v.textContent=c?.error?'신호 정보를 받지 못했습니다 ('+c.error+')':c&&!c.loading&&!ph?'이 교차로는 실시간 신호 정보가 없습니다':'신호 확인 중…';return;
  }
  const R=(ph.expiresAt-now)/1000;
  document.querySelector('.lights .'+({red:'r',yellow:'y',green:'g'}[ph.color]||'r')).classList.add('on');
  $('sigSecs').textContent=Math.ceil(R)+'초';
  let cls='na',txt='';
  if(ph.color==='green'){
    if(eta<=R-2){cls='ok';txt=`통과 가능 · 도착 약 ${Math.round(eta)}초, 녹색 ${Math.ceil(R)}초 남음`;}
    else if(eta<=R+3){cls='warn';txt=`아슬아슬 · 감속 준비 (도착 약 ${Math.round(eta)}초)`;}
    else{cls='no';txt=`정지 예상 · 도착 전에 신호가 바뀝니다`;}
    if(between.length&&cls!=='ok'){const allow=R-2-travel-6*between.length;if(allow>3)txt+=` · 정차를 ${Math.floor(allow)}초 이내로 하면 통과`;}
  }else if(ph.color==='yellow'){
    if(eta<R){cls='warn';txt='황색 · 통과 직전';}else{cls='no';txt='정지 · 황색 신호';}
  }else{
    if(eta>=R+1){cls='ok';txt=`도착 때 녹색 예상 · 적색 ${Math.ceil(R)}초 남음`;}
    else{cls='no';txt=`정지 예상 · 신호 대기 약 ${Math.ceil(R-eta)}초`;}
  }
  v.className='verdict '+cls;v.textContent=txt;
}

// ---------- run modes ----------
async function keepAwake(){try{wakeLock=await navigator.wakeLock?.request('screen');}catch(e){}}
function setRunning(mode){
  running=mode;$('stopBtn').hidden=!mode;$('startGps').hidden=!!mode;$('startSim').hidden=!!mode;
  document.querySelectorAll('#routeSeg button').forEach(b=>b.disabled=!!mode);
}
function startGps(){
  if(!navigator.geolocation){alert('이 기기에서는 위치를 쓸 수 없습니다.');return;}
  setRunning('gps');lap++;follow=true;lastAlong=null;announced.clear();keepAwake();
  $('nextStop').textContent='위치 확인 중…';
  watchId=navigator.geolocation.watchPosition(p=>onPosition(p.coords.latitude,p.coords.longitude,p.coords.accuracy,p.coords.speed,Date.now()),
    e=>{$('nextStop').textContent='위치를 받을 수 없습니다';$('nextStopInfo').textContent=e.message||'';},{enableHighAccuracy:true,maximumAge:0,timeout:15000});
}
function startSim(){
  setRunning('sim');lap++;follow=true;lastAlong=null;announced.clear();simAlong=0;simDwellUntil=0;simDetour=0;keepAwake();
  let t=performance.now(),stopDone=new Set();
  simTimer=setInterval(()=>{
    const now=performance.now(),dt=(now-t)/1000*simSpeedMul;t=now;
    if(Date.now()<simDwellUntil){emitSim(0);return;}
    const s=route.stops.find((x,i)=>!x.virtual&&!stopDone.has(i)&&x.along>simAlong&&x.along<=simAlong+8.3*dt+0.1);
    if(s){simAlong=s.along;stopDone.add(route.stops.indexOf(s));simDwellUntil=Date.now()+(8000+Math.random()*12000)/simSpeedMul;emitSim(0);return;}
    simAlong+=8.3*dt; // about 30 km/h
    if(simAlong>=route.length){stopRun();return;}
    emitSim(8.3);
  },250);
}
function emitSim(v){
  let [lat,lng]=pointAt(simAlong);
  if(simDetour>0){const h=(headingAt(simAlong)+90)*Math.PI/180;lat+=Math.cos(h)*simDetour/110540;lng+=Math.sin(h)*simDetour/(111320*Math.cos(lat*Math.PI/180));}
  onPosition(lat,lng,8,v,Date.now());
}
function stopRun(){
  if(watchId!=null)navigator.geolocation.clearWatch(watchId);watchId=null;clearInterval(simTimer);simTimer=null;
  try{wakeLock?.release();}catch(e){}wakeLock=null;
  offRoute=false;offSince=null;alertOff();if(busMarker){map.removeLayer(busMarker);busMarker=null;}
  setRunning(null);if(route){along=0;lastAlong=null;nextStopIdx=-1;renderStops();renderIdle();}
}
$('startGps').onclick=startGps;$('startSim').onclick=startSim;$('stopBtn').onclick=stopRun;
$('detourBtn').onclick=()=>{simDetour=simDetour?0:120;$('detourBtn').classList.toggle('on',!!simDetour);};
[1,4,10].forEach(m=>{const b=document.createElement('button');b.textContent=m+'x';b.classList.toggle('on',m===1);b.onclick=()=>{simSpeedMul=m;document.querySelectorAll('#simSpeedSeg button').forEach(x=>x.classList.toggle('on',x===b));};$('simSpeedSeg').appendChild(b);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running)keepAwake();});

// ---------- boot ----------
fetch('routes.json').then(r=>r.json()).then(d=>{
  DATA=d;
  d.routes.forEach(r=>{const b=document.createElement('button');b.textContent=r.name;b.onclick=()=>selectRoute(r.name);$('routeSeg').appendChild(b);});
  const want=new URLSearchParams(location.search).get('route')||store.get('driverRoute','강서06');
  selectRoute(want);
}).catch(e=>{$('nextStop').textContent='노선 정보를 불러오지 못했습니다';});
</script>
